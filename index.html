<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Blog</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500&family=IBM+Plex+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f4;
    --ink:#20211f;
    --ink-soft:#5a5c56;
    --line:#dcd8cf;
    --accent:#2f6f62;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.6;
  }

  header{
    border-bottom:1px solid var(--line);
    padding:1.1rem 1.5rem;
  }
  nav{
    max-width:640px;
    margin:0 auto;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .wordmark{
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:1.15rem;
    color:var(--ink);
    text-decoration:none;
  }
  .nav-links{
    display:flex;
    gap:1.5rem;
  }
  .nav-links a{
    color:var(--ink-soft);
    text-decoration:none;
    font-size:0.95rem;
  }
  .nav-links a.current{
    color:var(--ink);
    border-bottom:1px solid var(--accent);
    padding-bottom:2px;
  }
  .nav-links a:hover{ color:var(--ink); }

  main{
    max-width:640px;
    margin:0 auto;
    padding:3rem 1.5rem 5rem;
  }
  .page-title{
    font-family:'Fraunces', serif;
    font-size:2.4rem;
    font-weight:600;
    margin:0 0 2.5rem;
  }

  .post{
    display:block;
    text-decoration:none;
    color:inherit;
    padding:1.6rem 0;
    border-bottom:1px solid var(--line);
  }
  .post:first-of-type{ padding-top:0; }
  .post-date{
    font-family:'IBM Plex Mono', monospace;
    font-size:0.78rem;
    color:var(--accent);
    letter-spacing:0.02em;
  }
  .post-title{
    font-family:'Fraunces', serif;
    font-size:1.4rem;
    font-weight:600;
    margin:0.35rem 0 0.5rem;
  }
  .post-excerpt{
    color:var(--ink-soft);
    font-size:0.97rem;
    margin:0;
  }
  .post:hover .post-title{ color:var(--accent); }

  .empty{
    color:var(--ink-soft);
    font-size:0.97rem;
  }

  @media (prefers-color-scheme: dark){
    :root{
      --paper:#181917;
      --ink:#efeee9;
      --ink-soft:#a5a49c;
      --line:#33342f;
      --accent:#6fbfa8;
    }
  }
</style>
</head>
<body>

<header>
  <nav>
    <a href="index.html" class="wordmark">Your Name</a>
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="blog.html" class="current">Blog</a>
    </div>
  </nav>
</header>

<main>
  <h1 class="page-title">Blog</h1>

  <div id="post-list">
    <!-- Posts render here from the array below -->
  </div>
</main>

<script>
  // Add one entry per post. Newest first.
  // `url` can point to another .html file you write for the full post.
  const posts = [
    {
      title: "Hello, world",
      date: "2026-09-26",
      excerpt: "First post — what this blog is for and what I'm working on.",
      url: "posts/hello-world.html"
    }
  ];

  const list = document.getElementById('post-list');

  if (posts.length === 0) {
    list.innerHTML = '<p class="empty">No posts yet.</p>';
  } else {
    posts.forEach(post => {
      const a = document.createElement('a');
      a.className = 'post';
      a.href = post.url;
      a.innerHTML = `
        <div class="post-date">${post.date}</div>
        <h2 class="post-title">${post.title}</h2>
        <p class="post-excerpt">${post.excerpt}</p>
      `;
      list.appendChild(a);
    });
  }
</script>

</body>
</html>
